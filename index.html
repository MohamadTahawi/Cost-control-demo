<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cost Control Demo</title>
  <style>
    body {
      margin: 0;
      background: #f2f5f8;
      color: #172638;
      font: 16px system-ui, sans-serif;
    }
    main { max-width: 740px; margin: auto; padding: 24px; }
    section {
      background: white;
      padding: 20px;
      margin: 16px 0;
      border-radius: 12px;
      border: 1px solid #dbe3ea;
    }
    h1, h2 { margin-top: 0; }
    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    label { display: grid; gap: 6px; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      border: 1px solid #8696a7;
      border-radius: 6px;
      font: inherit;
    }
    output { font-weight: 700; }
    #status { color: #9b3024; }
  </style>
</head>
<body>
  <main>
    <h1>Cost Control Demo</h1>
    <p>MEP Division · Demo figures in AED</p>

    <section>
      <h2>1. Cost Sheet</h2>
      <div class="fields">
        <label>Original contract value
          <input id="contract" type="number" min="0" step="0.01"
                 value="100000" required>
        </label>
        <label>Certified to date on this contract
          <input id="certified" type="number" min="0" step="0.01"
                 value="75000" required>
        </label>
      </div>
    </section>

    <section>
      <h2>2. Division Cost Summary</h2>
      <div class="fields">
        <label>VO 1 · Approved
          <input id="vo1" type="number" step="0.01" value="10000" required>
        </label>
        <label>VO 2 · Approved
          <input id="vo2" type="number" step="0.01" value="-2000" required>
        </label>
        <label>Other certified costs in this division
          <input id="other" type="number" step="0.01" value="1000" required>
        </label>
      </div>
      <p>Revised contract value <output id="revised"></output></p>
      <p>Remaining to certify on this contract <output id="remaining"></output></p>
    </section>

    <section>
      <h2>3. Salaries &amp; Allocation</h2>
      <label>Salaries allocated to this division to date
        <input id="salary" type="number" min="0" step="0.01"
               value="3000" required>
      </label>
    </section>

    <section>
      <h2>4. Cost Report</h2>
      <p>Division actual cost <output id="actual"></output></p>
      <p id="status" role="status"></p>
    </section>
  </main>

  <script>
    const byId = (id) => document.getElementById(id);
    const fields = ["contract", "certified", "vo1", "vo2", "other", "salary"];
    const results = ["revised", "remaining", "actual"];
    const currency = new Intl.NumberFormat("en-AE", {
      style: "currency", currency: "AED"
    });

    // Calculate in fils, then format the result in dirhams.
    const fils = (id) => Math.round(byId(id).valueAsNumber * 100);
    const show = (id, value) => {
      byId(id).textContent = currency.format(value / 100);
    };

    function update() {
      const status = byId("status");

      if (fields.some((id) => !byId(id).validity.valid)) {
        results.forEach((id) => { byId(id).textContent = "—"; });
        status.textContent = "Enter valid amounts in all fields. Use 0 if unused.";
        return;
      }

      const revised = fils("contract") + fils("vo1") + fils("vo2");
      const certified = fils("certified");
      const remaining = revised - certified;
      const actual = certified + fils("other") + fils("salary");

      show("revised", revised);
      show("remaining", remaining);
      show("actual", actual);

      status.textContent = remaining < 0
        ? "Review required: certified amount exceeds the revised contract value."
        : "";
    }

    fields.forEach((id) => byId(id).addEventListener("input", update));
    update();
  </script>
</body>
</html>
